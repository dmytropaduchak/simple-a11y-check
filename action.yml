name: Simple A11y Check
description: Warn on common accessibility anti-patterns in PR-changed UI files.
author: Dmytro Paduchak
branding:
  icon: eye
  color: purple
inputs:
  github-token:
    description: Token to read PR diff and post comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
